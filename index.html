<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Memoriya - Cinematic AI Memory Platform</title>
    <meta name="theme-color" content="#070a12" />
    <meta name="description" content="Memoriya is a premium AI memory platform for cinematic reels, nostalgic timelines, private albums, future capsules, and family storytelling." />
    <meta name="robots" content="index,follow" />
    <meta property="og:title" content="Memoriya - Cinematic AI Memory Platform" />
    <meta property="og:description" content="Turn photos, places, and family albums into emotional AI-generated memory stories." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root">
      <!-- First-paint splash: replaced by React as soon as the bundle mounts.
           Keeps the screen from looking frozen while the app JS downloads. -->
      <div
        id="boot-splash"
        style="min-height:100vh;display:grid;place-items:center;background:#070a12;color:#fff;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;text-align:center"
      >
        <div>
          <div style="font-size:26px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase">Memoriya</div>
          <div style="margin-top:12px;font-size:12px;letter-spacing:0.22em;text-transform:uppercase;color:rgba(255,255,255,0.55)">
            Opening your memories
          </div>
          <div style="margin:18px auto 0;height:4px;width:180px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,0.12)">
            <div style="height:100%;width:40%;border-radius:999px;background:#67e8f9;animation:memo-boot-bar 1.1s ease-in-out infinite"></div>
          </div>
        </div>
        <style>
          @keyframes memo-boot-bar {
            0% { transform: translateX(-110%); }
            100% { transform: translateX(320%); }
          }
          @media (prefers-reduced-motion: reduce) {
            #boot-splash div[style*="animation"] { animation: none; width: 100% !important; }
          }
        </style>
      </div>
    </div>
    <script>
      // Mark Android TV before styles and React mount. Chromium 66 ignores
      // Tailwind's @layer utilities, so the legacy layout must be active from
      // the first paint. sdk_google_atv is used by the Android 9 TV image.
      (function () {
        var ua = navigator.userAgent || '';
        var android = ua.match(/Android\s+(\d+)/i);
        var chrome = ua.match(/(?:Chrome|Chromium)\/(\d+)/i);
        var oldNonMobileAndroid = android && Number(android[1]) <= 9 && !/Mobile/i.test(ua);
        var oldChromiumTv = chrome && Number(chrome[1]) <= 66 && !/Mobile/i.test(ua);
        if (oldNonMobileAndroid || oldChromiumTv || /(?:Geestar|Geestart|GoBrowser|Go Browser)/i.test(ua)) {
          document.documentElement.className += ' legacy-tv-browser';
        }
      }());
      // Android 9 TV WebView (Chromium 66) has no queueMicrotask. This must
      // run before the module graph is evaluated because React may use it
      // during module initialization.
      if (!window.queueMicrotask) {
        window.queueMicrotask = function (callback) {
          Promise.resolve().then(callback);
        };
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
