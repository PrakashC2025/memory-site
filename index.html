<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Memoriya - Cinematic AI Memory Platform</title>
    <meta name="theme-color" content="#070a12" />
    <meta name="description" content="Memoriya is a premium AI memory platform for cinematic reels, nostalgic timelines, private albums, future capsules, and family storytelling." />
    <meta name="robots" content="index,follow" />
    <meta property="og:title" content="Memoriya - Cinematic AI Memory Platform" />
    <meta property="og:description" content="Turn photos, places, and family albums into emotional AI-generated memory stories." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Mark Android TV before styles and React mount. Chromium 66 ignores
      // Tailwind's @layer utilities, so the legacy layout must be active from
      // the first paint. sdk_google_atv is used by the Android 9 TV image.
      (function () {
        var ua = navigator.userAgent || '';
        var android = ua.match(/Android\s+(\d+)/i);
        var chrome = ua.match(/(?:Chrome|Chromium)\/(\d+)/i);
        var oldNonMobileAndroid = android && Number(android[1]) <= 9 && !/Mobile/i.test(ua);
        var oldChromiumTv = chrome && Number(chrome[1]) <= 66 && !/Mobile/i.test(ua);
        if (oldNonMobileAndroid || oldChromiumTv || /(?:Geestar|Geestart|GoBrowser|Go Browser)/i.test(ua)) {
          document.documentElement.className += ' legacy-tv-browser';
        }
      }());
      // Android 9 TV WebView (Chromium 66) has no queueMicrotask. This must
      // run before the module graph is evaluated because React may use it
      // during module initialization.
      if (!window.queueMicrotask) {
        window.queueMicrotask = function (callback) {
          Promise.resolve().then(callback);
        };
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
